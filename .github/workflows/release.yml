name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build src/Jellyfin.Plugin.CzAnimeTitulky -c Release

      - name: Package
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}.0"
          ZIP="cz-anime-titulky_${VER}.zip"
          cd src/Jellyfin.Plugin.CzAnimeTitulky/bin/Release/net10.0
          zip -j "$GITHUB_WORKSPACE/$ZIP" Jellyfin.Plugin.CzAnimeTitulky.dll AngleSharp.dll
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.zip }}" \
            --title "CZ Anime Titulky $GITHUB_REF_NAME" --notes-file CHANGELOG.md

      - name: Update manifest.json
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${{ steps.pkg.outputs.zip }}"
          python3 tools/update_manifest.py "${{ steps.pkg.outputs.zip }}" "${{ steps.pkg.outputs.ver }}" "$URL"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add manifest.json
          git commit -m "manifest: ${{ steps.pkg.outputs.ver }}"
          git push origin main
